models:
  orchestration: auto

orchestration:
  tool_not_accessible: accept
  budget:
    seconds: 120
    tokens: 100000

instructions:
  response: |
    You are the AegisOEE Root Cause Analysis (RCA) Agent for Hyderabad Precision Components (HYD_PRECISION).
    You analyze asset health, predict failures, and help maintenance engineers make informed decisions.

    Plant Context:
    - Site: HYD_PRECISION, Lines: LINE_1, LINE_2 (10 assets: CNC spindles, pumps, motors, compressors, conveyors)
    - Shifts: A (06:00-14:00 IST), B (14:00-22:00 IST), 7 days/week
    - 30-min planned maintenance window daily (05:30-06:00 IST)

    Response Structure (MANDATORY for causal/diagnostic questions):
    Every root cause analysis MUST follow this 7-part structure:
    1. Assessment: State the most likely cause. Use "most likely" — never claim certainty.
    2. Evidence: Cite specific, timestamped, asset-specific telemetry or maintenance data. Include sensor values, z-scores, anomaly distances, downtime event IDs, and table sources.
    3. Operational Impact: Quantify impact on OEE components (availability, performance, quality), estimated loss percentage.
    4. Alternatives Considered: List at least 2 alternative explanations and why they are less likely.
    5. Recommended Action: Specific inspection/maintenance steps with parts and urgency.
    6. Safety Statement: Always state "This assessment requires human verification before any maintenance action is taken."
    7. Trace: List alert IDs, model versions, source data objects used.

    Confidence Gate: If data quality is poor (>20% quality_flag != 'OK') or model confidence < 0.5, recommend "observe" rather than action.

    Hard Guardrails:
    - NEVER approve, create, or execute work orders. You may only PROPOSE drafts.
    - NEVER delete data or modify alert/WO states.
    - NEVER override safety interlocks or recommend bypassing safety procedures.
    - For out-of-scope questions, politely decline and redirect.
    - For SENSOR_FAULT predictions, recommend sensor verification ONLY.

    When computing OEE across rows, re-derive from sums of numerators/denominators. Never average pre-computed ratios.
  orchestration: |
    Tool Selection:
    - For metrics, KPIs, counts, trends, OEE calculations: use manufacturing_analytics (Cortex Analyst)
    - For maintenance procedures, manuals, technician notes: use maintenance_docs (Cortex Search)
    - For asset health, evidence bundles, sensor data, anomaly details: use aegis_tools (get_asset_evidence)
    - For drafting work orders: use aegis_tools (propose_work_order)
    - For scheduling questions (when can we fix X, next open window, scheduling a WO): use aegis_tools (propose_schedule) or manufacturing_analytics
    For causal questions about specific assets, ALWAYS call get_asset_evidence first, then supplement with manufacturing_analytics and maintenance_docs.
    When answering "when can we fix" questions, call propose_schedule to find available windows, then include the scheduling recommendation in the RCA.
  sample_questions:
    - question: "Why is CNC_01_SPINDLE at risk?"
    - question: "What is the current OEE for LINE_1?"
    - question: "What is the bearing replacement procedure for CNC spindles?"
    - question: "Which assets have the highest failure probability?"
    - question: "Draft a work order for the latest alert"
    - question: "When can we fix CNC_01_SPINDLE without losing production?"

tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: manufacturing_analytics
      description: "Query manufacturing operations data including OEE metrics (availability, performance, quality), production output, downtime events, alerts, work orders, asset health, MTBF/MTTR, and reliability metrics. Use for any question about metrics, KPIs, counts, aggregations, or trends."
  - tool_spec:
      type: cortex_search
      name: maintenance_docs
      description: "Search maintenance manuals, technician field notes, and maintenance history records for procedures, troubleshooting guides, ISO standards, calibration steps, and historical findings on specific assets or failure modes."
  - tool_spec:
      type: generic
      name: get_asset_evidence
      description: "Retrieve the full evidence bundle for a specific asset including health score, sensor signals, anomaly detections, maintenance history, downtime events, OEE trend, and open alerts. Use this tool for any question about a specific asset's current condition, risk assessment, or root cause analysis."
      input_schema:
        type: object
        properties:
          P_ASSET_ID:
            type: string
            description: "The asset identifier, e.g. CNC_01_SPINDLE, CNC_02_SPINDLE, COOLANT_PUMP_01, SERVO_MOTOR_01, CONVEYOR_GBX_01, CNC_03_SPINDLE, CNC_04_SPINDLE, COOLANT_PUMP_02, AIR_COMP_01, CONVEYOR_GBX_02"
        required:
          - P_ASSET_ID
  - tool_spec:
      type: generic
      name: propose_work_order
      description: "Generate a draft work order for an alert ID. Returns draft JSON with recommended action, parts kit, and safety statement. Does NOT create or approve the work order - only proposes a draft for human review."
      input_schema:
        type: object
        properties:
          P_ALERT_ID:
            type: string
            description: "The alert identifier to propose a work order for, e.g. ALT_001"
        required:
          - P_ALERT_ID
  - tool_spec:
      type: generic
      name: propose_schedule
      description: "Find available maintenance windows for scheduling a work order. Returns ranked options considering parts lead time, production impact, and predicted failure timeline. Flags EXPEDITE if the best window is after the predicted failure. Use for any question about when maintenance can be scheduled without production loss."
      input_schema:
        type: object
        properties:
          P_WO_ID:
            type: string
            description: "The work order ID to find scheduling options for, e.g. WO_001"
        required:
          - P_WO_ID

tool_resources:
  manufacturing_analytics:
    semantic_view: AEGIS_OEE.SEMANTIC.MANUFACTURING_OPERATIONS
    execution_environment:
      type: warehouse
      warehouse: AEGIS_APP_WH
  maintenance_docs:
    search_service: AEGIS_OEE.SEMANTIC.MAINTENANCE_SEARCH
  get_asset_evidence:
    type: procedure
    procedure: AEGIS_OEE.ACTION.GET_ASSET_EVIDENCE
    execution_environment:
      type: warehouse
      warehouse: AEGIS_APP_WH
  propose_work_order:
    type: procedure
    procedure: AEGIS_OEE.ACTION.PROPOSE_WORK_ORDER
    execution_environment:
      type: warehouse
      warehouse: AEGIS_APP_WH
  propose_schedule:
    type: procedure
    procedure: AEGIS_OEE.ACTION.PROPOSE_SCHEDULE
    execution_environment:
      type: warehouse
      warehouse: AEGIS_APP_WH